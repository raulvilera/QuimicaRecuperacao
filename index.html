:root{--verde:#145A32;--verde2:#1e7a46;--fundo:#e9edf0;--card:#fff;--texto:#1d2a33;--borda:#c9d2d9}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Roboto,Arial,sans-serif;background:var(--fundo);color:var(--texto);line-height:1.5}
header.escola{background:var(--verde);color:#fff;text-align:center;padding:18px 16px}
header.escola h1{margin:0;font-size:1.25rem;letter-spacing:.5px}
header.escola p{margin:4px 0 0;font-size:.95rem;opacity:.9}
main{max-width:860px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:14px;padding:18px;margin-bottom:18px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid .full{grid-column:1/-1}
label{display:block;font-weight:600;font-size:.85rem;margin-bottom:3px}
select,input[type=text],textarea{width:100%;padding:10px;border:1px solid var(--borda);border-radius:8px;font:inherit;background:#fff}
input[readonly]{background:#f1f4f6;color:#44525d}
textarea{min-height:130px;resize:vertical}
.q h2{margin:0 0 8px;font-size:1.05rem;color:var(--verde)}
.q .tipo{font-size:.75rem;font-weight:700;background:#e3f1e9;color:var(--verde);padding:2px 8px;border-radius:99px;margin-left:6px;vertical-align:middle}
.q p.enun{margin:0 0 10px}
figure{margin:10px 0 14px;text-align:center}
figure svg{max-width:100%;height:auto;background:#fafcfd;border:1px solid var(--borda);border-radius:10px}
figcaption{font-size:.78rem;color:#5a6a76;margin-top:4px}
.alt{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;margin:10px 0;border-radius:10px;background:#eef1f4;cursor:pointer;user-select:none;
 box-shadow:4px 4px 8px rgba(0,0,0,.3),-2px -2px 6px rgba(255,255,255,.7);transition:all .15s ease-in-out}
.alt:hover{background:#e4e9ee}
.alt .letra{font-weight:700;min-width:1.4em}
.alt.selecionada{box-shadow:inset 3px 3px 6px rgba(0,0,0,.45);transform:translateY(2px);background:#145A32;color:#fff;font-weight:700}
.alt:focus-visible{outline:3px solid #f0b400}
.rubrica{font-size:.78rem;color:#5a6a76;margin-top:4px}
#progresso{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--borda);padding:8px 16px;text-align:center;font-size:.85rem}
button.enviar{display:block;width:100%;padding:14px;font-size:1.05rem;font-weight:700;border:0;border-radius:12px;background:var(--verde);color:#fff;cursor:pointer;
 box-shadow:4px 4px 8px rgba(0,0,0,.3)}
button.enviar:disabled{opacity:.5;cursor:not-allowed}
#msg{margin-top:12px;padding:12px;border-radius:10px;display:none;font-weight:600}
#msg.ok{display:block;background:#d9f0e2;color:#0d4026}
#msg.erro{display:block;background:#fbdcdc;color:#7a1212}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
</style>
</head>

/* ====== QUESTÕES (o gabarito NÃO está aqui: a correção é feita no Apps Script) ====== */
const Q = [
{t:"o",e:"Em fogões a gás e a álcool, a combustão do etanol aquece alimentos. O diagrama de entalpia (Figura 1) representa essa reação. Com base nele, classifique a combustão do etanol.",
 a:["Endotérmica, pois o ΔH é positivo e a reação absorve energia do ambiente.","Exotérmica, pois os produtos têm entalpia menor que a dos reagentes (ΔH < 0) e a reação libera energia.","Endotérmica, pois é preciso uma chama para iniciar a reação.","Exotérmica, pois o ΔH é positivo e a energia é liberada na forma de calor.","Nem endotérmica nem exotérmica, pois a energia total se conserva."]},
{t:"o",e:"As bolsas instantâneas de gelo, usadas em lesões esportivas, contêm água e nitrato de amônio em compartimentos separados. Ao serem rompidas, a temperatura varia como mostra a Figura 2. Qual alternativa classifica corretamente o processo?",
 a:["Exotérmico: libera calor para o ambiente e o ΔH é negativo.","Exotérmico: o ΔH é positivo porque a temperatura diminui.","Endotérmico: o ΔH é negativo porque o sistema esfria.","Endotérmico: absorve calor do ambiente (e da região machucada) e o ΔH é positivo.","Isotérmico: não há troca de calor entre a bolsa e o ambiente."]},
{t:"o",e:"Em um laboratório escolar, acompanhou-se a transformação A → B. A Figura 3 mostra a variação das concentrações de A e de B ao longo do tempo. Qual alternativa interpreta corretamente o gráfico?",
 a:["A curva 1 representa o reagente (A), que é consumido, e a curva 2 representa o produto (B); a reação termina em 6 min.","A curva 1 representa o produto (B) e a curva 2 representa o reagente (A); a reação termina em 6 min.","A curva 1 representa o reagente e a curva 2 o produto; a reação termina em 3 min, quando as curvas se cruzam.","As duas curvas representam reagentes, pois ambas variam com o tempo.","A curva 1 representa o reagente e a reação não termina, pois a concentração de B continua aumentando."]},
{t:"o",e:"Um fogão precisa liberar 2 300 kJ para cozinhar uma refeição. Usando os dados da Figura 4, qual massa de gasolina, queimada completamente, libera essa quantidade de energia?",
 a:["100 g","25 g","50 g","2,0 g","105,8 g"]},
{t:"o",e:"Em um experimento sobre rapidez de reações, três comprimidos efervescentes foram dissolvidos em água sob condições diferentes (Figura 5). Para explicar por que o experimento B é mais rápido que o A, deve-se considerar que:",
 a:["em B a temperatura é maior, o que aumenta a energia cinética das moléculas.","em B a concentração de água é menor, o que favorece as colisões.","em B há catalisador, que diminui a energia de ativação.","em B o volume de água é menor, o que torna a reação endotérmica.","em B o comprimido triturado tem maior superfície de contato, o que aumenta o número de colisões efetivas."]},
{t:"o",e:"O carbono grafite pode queimar produzindo CO₂ diretamente ou passando antes por CO (combustão incompleta, em locais mal ventilados). Usando os dados da Figura 6 e a Lei de Hess, calcule o ΔH₃ da reação C(grafite) + ½ O₂(g) → CO(g).",

 a:["−183 kJ (exotérmica)","+183 kJ (endotérmica)","−862 kJ (exotérmica)","+679 kJ (endotérmica)","+1 541 kJ (endotérmica)"]},

/* ====== LÓGICA ====== */
const $ = id => document.getElementById(id);
const resp = {};          // {1:"B", 2:"D", ..., 8:"texto"}
const L = ["A","B","C","D","E"];
 
function montar(){
  const box = $("questoes");
  Q.forEach((q,i)=>{
    const n=i+1, s=document.createElement("section");
    s.className="card q";
    let h=`<h2>Questão ${n}<span class="tipo">${q.t==="o"?"Objetiva":"Dissertativa"}</span></h2><p class="enun">${q.e}</p>
      <figure>${FIG[n]}<figcaption>${LEG[n]}</figcaption></figure>`;
    if(q.t==="o"){
      h+=`<div role="radiogroup" aria-label="Alternativas da questão ${n}">`+q.a.map((t,j)=>
        `<div class="alt" role="radio" aria-checked="false" tabindex="0" data-q="${n}" data-l="${L[j]}"><span class="letra">${L[j]})</span><span>${t}</span></div>`).join("")+`</div>`;
    } else {
      h+=`<textarea data-d="${n}" placeholder="Escreva sua resposta aqui…"></textarea><div class="rubrica">Resposta avaliada pelo professor (0 a 1,0).</div>`;
    }
    s.innerHTML=h; box.appendChild(s);
  });
  box.addEventListener("click",e=>{const a=e.target.closest(".alt"); if(a) marcar(a);});
  box.addEventListener("keydown",e=>{ if((e.key===" "||e.key==="Enter")&&e.target.classList.contains("alt")){e.preventDefault();marcar(e.target);} });
  box.addEventListener("input",e=>{ if(e.target.dataset.d){resp[e.target.dataset.d]=e.target.value.trim();contar();} });
}
function marcar(a){
  const n=a.dataset.q;
  document.querySelectorAll(`.alt[data-q="${n}"]`).forEach(x=>{x.classList.remove("selecionada");x.setAttribute("aria-checked","false");});
  a.classList.add("selecionada");a.setAttribute("aria-checked","true");
  resp[n]=a.dataset.l; contar();
}
function contar(){ $("cont").textContent = Object.values(resp).filter(v=>v).length; }
 
/* Cabeçalho em cascata: Turma → Nome → Nº, RA, e-mail */
Object.keys(TURMAS).forEach(t=>{const o=document.createElement("option");o.value=o.textContent=t;$("turma").appendChild(o);});
$("turma").addEventListener("change",()=>{
  const n=$("nome"); n.innerHTML=""; limpar();
  const lista=TURMAS[$("turma").value];
  if(!lista){n.disabled=true;n.innerHTML='<option value="">Selecione primeiro a turma…</option>';return;}
  n.disabled=false; n.innerHTML='<option value="">Selecione seu nome…</option>';
  lista.forEach((a,i)=>{const o=document.createElement("option");o.value=i;o.textContent=a.nome;n.appendChild(o);});
});
$("nome").addEventListener("change",()=>{
  const a=(TURMAS[$("turma").value]||[])[$("nome").value];
  if(!a){limpar();return;}
  $("num").value=a.n; $("ra").value=a.ra+"-"+a.dig; $("email").value=a.email;
});
function limpar(){["num","ra","email"].forEach(i=>$(i).value="");}
 
/* Envio ao Google Sheets via Apps Script */
$("btn").addEventListener("click",async()=>{
  const m=$("msg"); m.className="";
  if(!$("turma").value||$("nome").value===""){m.className="erro";m.textContent="Selecione sua turma e seu nome antes de enviar.";return;}
  const faltam=[]; for(let i=1;i<=10;i++){ if(!resp[i]) faltam.push(i); }
  if(faltam.length && !confirm("Você não respondeu a(s) questão(ões): "+faltam.join(", ")+". Deseja enviar mesmo assim?")) return;
  const a=TURMAS[$("turma").value][$("nome").value];
  const dados={turma:$("turma").value,nome:a.nome,numero:a.n,ra:a.ra+"-"+a.dig,email:a.email,respostas:resp,enviadoEm:new Date().toISOString()};
  if(URL_APPS_SCRIPT.startsWith("COLE_AQUI")){m.className="erro";m.textContent="Atividade ainda não conectada à planilha (URL do Apps Script não configurada). Avise o professor.";return;}
  $("btn").disabled=true; $("btn").textContent="Enviando…";
  try{
    await fetch(URL_APPS_SCRIPT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(dados)});
    m.className="ok"; m.textContent="✔ Respostas enviadas com sucesso! Você já pode fechar esta página.";
    $("btn").textContent="ENVIADO";
  }catch(err){
    m.className="erro"; m.textContent="Falha no envio. Verifique a internet e tente novamente.";
    $("btn").disabled=false; $("btn").textContent="ENVIAR RESPOSTAS";
  }
});
montar();
</script>
